<title>Body Avatar</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
.container {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 0;
  height: 100vh;
}
.rotate-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(14,165,233,0.15);
  border: 1px solid rgba(14,165,233,0.3);
  color: #0ea5e9;
  font-size: 12px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 20px;
  cursor: pointer;
  margin-bottom: 8px;
}
.rotate-btn:active { opacity: 0.7; }
.rotate-btn svg { width: 14px; height: 14px; }
.avatar-wrap {
  position: relative;
  display: flex;
  justify-content: center;
  flex: 1;
  width: 100%;
  max-height: calc(100vh - 50px);
}
.avatar-wrap img {
  height: 100%;
  max-height: 500px;
  object-fit: contain;
  pointer-events: none;
}
.avatar-wrap svg {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  height: 100%;
  max-height: 500px;
}
.avatar-wrap svg g.part path { fill: rgba(0,140,153,0.35); cursor: pointer; transition: fill 0.15s; }
.avatar-wrap svg g.part:active path { fill: rgba(14,165,233,0.6); }
.avatar-wrap svg g.part.tapped path { fill: rgba(14,165,233,0.5); }
.hidden { display: none; }
</style>

<script>
var gender = 'male';
var view = 'front';
var params = new URLSearchParams(window.location.search);
if (params.get('gender')) gender = params.get('gender');

function init() {
  showView();
}

function showView() {
  document.querySelectorAll('.avatar-wrap').forEach(function(el) { el.classList.add('hidden'); });
  var id = gender + '-' + view;
  var el = document.getElementById(id);
  if (el) el.classList.remove('hidden');
  document.getElementById('rotateLabel').textContent = view === 'front' ? 'Show Back' : 'Show Front';
}

function rotate() {
  view = view === 'front' ? 'back' : 'front';
  showView();
}

function tap(el) {
  var part = el.getAttribute('data-part');
  // Visual feedback
  el.classList.add('tapped');
  setTimeout(function() { el.classList.remove('tapped'); }, 300);
  // Send to React Native
  if (window.ReactNativeWebView) {
    window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'body_part', part: part }));
  }
}

init();
</script>
